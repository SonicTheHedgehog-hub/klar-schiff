<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Klar Schiff</title>
<meta name="description" content="Euer gemeinsamer Putz- und Haushaltsplan">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1726" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Klar Schiff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" hidden aria-hidden="true">
  <svg class="sea" viewBox="0 0 360 230" role="img" aria-label="Eine kleine Yacht segelt über die Wellen">
    <g class="sun"><circle cx="292" cy="54" r="22"/></g>
    <g class="bird"><path d="M64 60q6-6 12 0q6-6 12 0"/><path d="M96 44q4-4 8 0q4-4 8 0"/></g>
    <g class="wave back"><path d="M0 150 Q 45 136 90 150 T 180 150 T 270 150 T 360 150 T 450 150 T 540 150 T 630 150 T 720 150 V 230 H 0 Z"/></g>
    <g class="boat-move"><g class="boat">
      <path class="flag" d="M181 34 l15 5 -15 5z"/>
      <line class="mast" x1="181" y1="34" x2="181" y2="144"/>
      <path class="main" d="M177 46 L177 136 L121 136 Z"/>
      <path class="jib" d="M185 54 L185 132 L229 132 Z"/>
      <path class="hull" d="M114 142 H 248 L 230 164 Q 180 172 132 164 Z"/>
      <rect class="cabin" x="160" y="132" width="44" height="10" rx="3"/>
      <circle class="porthole" cx="152" cy="153" r="3"/><circle class="porthole" cx="168" cy="154" r="3"/><circle class="porthole" cx="184" cy="154" r="3"/>
    </g></g>
    <g class="wave front"><path d="M0 166 Q 45 154 90 166 T 180 166 T 270 166 T 360 166 T 450 166 T 540 166 T 630 166 T 720 166 V 230 H 0 Z"/></g>
  </svg>
  <div class="splash-name">Klar Schiff</div>
  <div class="splash-sub">Leinen los für heute</div>
</div>
<script>
  // Yacht nur beim ersten Öffnen des Tages zeigen.
  try {
    var day = JSON.stringify(new Date().toDateString());
    if (localStorage.getItem('ks-splash') !== day) {
      localStorage.setItem('ks-splash', day);
      var sp = document.getElementById('splash'); sp.hidden = false; sp.dataset.t = Date.now();
    }
  } catch (e) {}
</script>
<div class="app">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 13a7 7 0 0 0 14 0M8 10h8"/></svg>Klar Schiff</div>
    <span class="sync" id="sync" hidden></span>
    <button class="iconbtn" id="meBtn" data-act="go" data-v="settings" aria-label="Mein Profil" hidden></button>
    <button class="iconbtn" id="setBtn" data-act="go" data-v="settings" aria-label="Einstellungen" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"><div class="loading">Klar Schiff wird geladen …</div></main>
</div>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-act="go" data-v="today"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></span>Heute</button>
  <button data-act="go" data-v="week"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>Woche</button>
  <button data-act="go" data-v="rooms"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></span>Räume</button>
  <button data-act="go" data-v="stats"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg></span>Punkte</button>
</div></nav>
<div id="sheet"></div>
<div id="toast"></div>
<noscript><p style="padding:20px">Klar Schiff braucht JavaScript.</p></noscript>
<script src="vendor/supabase.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
